<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Author: Juan Liao
      Project: Juan's Kitchen Online Menu
      Description:
        Main HTML page for Juan's Kitchen website.
        Includes navigation bar, dynamic menu tabs,
        shopping cart UI, footer with social links,
        and loads external stylesheets and JS modules.

      Technologies:
        - Bootstrap 5.3 for styling and responsive layout
        - Ionicons for icons
    -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Order System</title>

    <!-- Bootstrap CSS for responsive design and styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap JS Bundle with Popper.js for interactive components -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Google Fonts for typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- Custom stylesheets -->
    <!-- <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/cart.css" /> -->
    <link rel="stylesheet" href="./css/custom.css" />
  </head>
  <body>
    <!-- Navbar (fixed to top) -->
    <nav
      class="navbar navbar-expand-lg fixed-top navbar-custom shadow-sm px-4 d-flex justify-content-between align-items-center"
    >
      <a href="/" class="navbar-brand p-0">
        <img src="./img/logo.png" alt="Juan's Kitchen Logo" class="logo" />
      </a>
      <button class="btn btn-call-server" aria-label="Call us">
        <ion-icon name="call-outline" size="large"></ion-icon
        ><span>Call Server</span>
      </button>
    </nav>

    <div class="main-content d-flex">
      <!-- Sidebar tab menu -->
      <div class="tab-menu">
        <nav class="nav flex-column py-5">
          <!--
              Tab links:
              - data-id corresponds to the content section id
              - Active class highlights the default tab
            -->
          <a class="nav-link active" href="#starters" data-id="starters"
            >Starters</a
          >
          <a class="nav-link" href="#mains" data-id="mains">Mains</a>
          <a class="nav-link" href="#vegetarian" data-id="vegetarian"
            >Vegetarian</a
          >
          <a class="nav-link" href="#desserts" data-id="desserts">Desserts</a>
          <a class="nav-link" href="#drinks" data-id="drinks">Drinks</a>
        </nav>
      </div>

      <!-- Main content area -->
      <main class="content flex-grow-1">
        <div id="starters" class="tab-page px-2 px-sm-3 px-md-4 px-lg-5"></div>
        <div id="mains" class="tab-page px-2 px-sm-3 px-md-4 px-lg-5"></div>
        <div
          id="vegetarian"
          class="tab-page px-2 px-sm-3 px-md-4 px-lg-5"
        ></div>
        <div id="desserts" class="tab-page px-2 px-sm-3 px-md-4 px-lg-5"></div>
        <div id="drinks" class="tab-page px-2 px-sm-3 px-md-4 px-lg-5"></div>
        <!-- Footer -->
        <footer
          id="footer"
          class="border-top py-3 text-center bg-white mt-auto"
        >
          <div
            class="container d-flex flex-column flex-md-row justify-content-between align-items-center"
          >
            <div>
              <a
                href="/"
                class="text-body-secondary text-decoration-none lh-1 me-2"
              >
                <svg class="bi" width="30" height="24">
                  <use xlink:href="#bootstrap" />
                </svg>
              </a>
              <span class="text-body-secondary"
                >&copy; 2024 Juan's Kitchen, Inc</span
              >
            </div>
            <ul class="nav list-unstyled d-flex mb-0">
              <li class="me-3">
                <a href="#" class="text-body-secondary"
                  ><ion-icon name="logo-facebook" class="h4"></ion-icon
                ></a>
              </li>
              <li class="me-3">
                <a href="#" class="text-body-secondary"
                  ><ion-icon name="logo-pinterest" class="h4"></ion-icon
                ></a>
              </li>
              <li>
                <a href="#" class="text-body-secondary"
                  ><ion-icon name="logo-instagram" class="h4"></ion-icon
                ></a>
              </li>
            </ul>
          </div>
        </footer>
        <!-- Shopping Cart Panel: initially hidden  -->
        <!-- 购物车面板 -->
        <div
          id="cartPage"
          class="cart-panel bg-light border rounded shadow position-fixed end-0 bottom-0 d-none"
        >
          <!-- 顶部标题和关闭按钮 -->
          <div
            class="d-flex justify-content-center align-items-center border-bottom py-3 position-relative"
          >
            <h5 class="mb-0 text-primary fw-bold">Order Details</h5>
            <button
              type="button"
              id="cartShutter"
              class="custom-btn cartShutter position-absolute top-50 end-0 translate-middle-y me-3"
              aria-label="Close"
            >
              <ion-icon name="close-outline" size="large"></ion-icon>
            </button>
          </div>

          <!-- 购物车内容 -->
          <div
            class="cart-content overflow-auto px-3 py-2"
            style="max-height: calc(100% - 120px)"
          >
            <!-- 头部行 -->
            <div
              class="row fw-bold border-bottom pb-2 align-items-center text-center"
            >
              <div class="col-1"><input type="checkbox" id="selectAll" /></div>
              <div class="col-2">Picture</div>
              <div class="col-4 text-start">Name</div>
              <div class="col-2 text-end">Price</div>
              <div class="col-2 text-center">Quantity</div>
              <div class="col-1 text-center">Delete</div>
            </div>

            <!-- 动态商品列表容器 -->
            <div id="goods" class="">
              <!-- <div
                class="row align-items-center py-2 border-bottom"
                id="item-1655771835688"

                </div>
                <div class="col-2">
                  <img

                    class="img-fluid rounded"
                  />
                </div>

                <div class="col-2 text-end">$ price</div>
                <div
                  class="col-2 d-flex justify-content-center align-items-center gap-2"
                >
                  <button type="button" class="custom-btn quantity-decrease">
                    <ion-icon name="remove-circle-outline"></ion-icon>
                  </button>
                  <input
                    type="text"
                    class="form-control form-control-sm text-center"
                    value="1"
                    readonly
                    style="width: 40px"
                  />

                    type="button"
                    class="btn btn-sm btn-outline-secondary quantity-increase"
                  >
                    <ion-icon name="add-circle-outline"></ion-icon>
                  </button>
                </div>
                <div class="col-1 text-center">
                  <button
                    type="button"
                    class="custom-btn text-danger delete-item p-0"
                  >
                    <ion-icon name="trash-outline"></ion-icon>
                  </button>
                </div>
              </div> -->
            </div>
          </div>

          <!-- 底部统计和操作 -->
          <div class="cart-footer border-top px-4 py-4">
            <div class="row fw-bold text-primary mb-2">
              <div class="col-7 text-end">Cart total:</div>
              <div class="col-5 text-end" id="amount">$0.00</div>
            </div>
            <div class="row fw-bold text-primary mb-2">
              <div class="col-7 text-end">Tax (5%):</div>
              <div class="col-5 text-end" id="taxAmount">$0.00</div>
            </div>
            <div class="row fw-bold text-primary mb-3">
              <div class="col-7 text-end">Total:</div>
              <div class="col-5 text-end" id="totalAmount">$0.00</div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <button
                type="button"
                id="delall"
                class="btn btn-outline-danger btn-sm"
              >
                Clear All
              </button>
              <button type="button" class="btn btn-checkout" id="checkoutBtn">
                Proceed to Checkout
              </button>
            </div>
          </div>
        </div>

        <!-- Floating cart icon with item count -->
        <div
          class="cart-icon position-fixed cart-icon-pos rounded-circle d-flex align-items-center justify-content-center"
          id="cartIcon"
        >
          <ion-icon name="cart-outline" class="cart-outline"></ion-icon>
          <div
            class="num position-absolute rounded-circle text-white d-flex align-items-center justify-content-center"
            id="cartNum"
          >
            0
          </div>
        </div>
      </main>
    </div>

    <!-- ****************************** -->
    <!-- JavaScript resources and modules -->

    <!-- Ionicons for vector icons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <!-- Menu rendering and tab switching -->
    <script type="module" src="./js/menu.js"></script>

    <!-- Shopping cart module -->
    <script type="module" src="./js/cart.js"></script>
  </body>
</html>
